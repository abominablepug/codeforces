name: Auto-Organize Solutions

on:
  push:
    branches:
      - main
    paths:
      - "*.cpp"
      - "*.cc"
      - "*.rs"
      - "ratings/**"
      - "problems.json"
      - "sprints.json"
      - "organize.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Organize solutions and update dashboards
        run: python3 organize.py --non-interactive

      - name: Commit and push changes if needed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: auto-organize solutions and update dashboard [skip ci]"
            git push
          fi
